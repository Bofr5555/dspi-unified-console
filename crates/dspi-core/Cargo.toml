[package]
name = "dspi-core"
description = "The DSPi embedder API: one object for a GUI or a language binding, over dspi-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dspi-proto.workspace = true
# Without its default `usb`: this crate's own `usb` feature turns it on (WP CG3).
dspi-transport = { path = "../dspi-transport", default-features = false }
# Without the Terminal's parts: the mobile libraries (WP F1) carry neither the
# command grammar nor the bundled AutoEQ database.
# -- WP P0E -- `serde`: the diagnostics bundle's device dump is the probe's own
# serialisation, as `uconsole dump --json` prints it (derives only; serde is here anyway).
dspi-session = { path = "../dspi-session", default-features = false, features = ["serde"] }
dspi-link = { workspace = true, optional = true }
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# -- WP SECFWV -- the bundled-firmware manifest's SHA-256; already in the graph
# through dspi-session (its limits PIN hash), so no new crate
sha2 = "0.11"
# Bootloader and device enumeration (WP C11). Optional since WP CG3.
nusb = { version = "0.2", optional = true }
# -- WP SW-M1 -- to poll nusb's hot-plug stream (usb_pipe.rs); already in the graph through nusb
futures-core = { version = "0.3", optional = true }
# -- WP C0 --
# -- WP C1 --
# -- WP C1b --
# -- WP C2 --
# -- WP C3 --
# -- WP C4 --
# -- WP C5 --
# -- WP C6 --
# -- WP C7 --
# -- WP C8 --
# -- WP C9 --
# -- WP C10 --
# -- WP C11 --
# -- WP C12 --
# -- WP C13 --
# -- WP C14 --
# -- WP C15 --
# -- WP F1 --
# The Kotlin and Swift binding's derives and exports (feature `uniffi`).
uniffi = { workspace = true, optional = true }

[features]
# -- WP CG3 --
default = ["usb"]
# USB through nusb: on for desktop, macOS and Android. Off for iOS and for
# wasm32-unknown-unknown (WP WB1), where nusb has no backend and does not compile;
# the USB methods stay in the API and report no devices or `Unsupported`, so one
# binding fits every platform.
usb = ["dep:nusb", "dep:futures-core", "dspi-transport/usb"]
# DSPi Link sessions (WP C15, over dspi-transport's Link adapter, WP T5).
# -- WP SECCORE -- with TLS (dspi-link `tls`): native targets only; the web
# build has neither the module nor rustls/ring, the feature notwithstanding
link = ["dep:dspi-link", "dspi-transport/link", "dspi-link/tls"]
# -- WP CG2 --
# Finding hubs over mDNS (link_browse.rs). Desktop only: dspi-ffi must not enable it
# (tests/wp_cg2_mobile_no_mdns.rs).
mdns = ["link", "dspi-link/mdns"]
# Desktop MIDI ports through midir (WP T3).
midir = ["dspi-transport/midir"]
# UniFFI derives and exports, for crates/dspi-ffi (WP F1).
uniffi = ["dep:uniffi"]

[dev-dependencies]
proptest = "1"
# -- WP C0 --
# -- WP C1 --
# -- WP C1b --
# -- WP C2 --
# -- WP C3 --
# -- WP C4 --
# -- WP C5 --
# -- WP C6 --
# -- WP C7 --
# -- WP C8 --
# -- WP C9 --
# -- WP C10 --
# -- WP C11 --
# -- WP C12 --
# -- WP C13 --
# -- WP C14 --
# -- WP C15 --
# The fake hub, for the Link session and fault-injection tests.
# -- WP SECCORE -- `tls`: the fake hub serves TLS
dspi-link = { path = "../dspi-link", features = ["fake-hub", "tls"] }
# -- WP F1 --

[target.'cfg(unix)'.dependencies]
# -- WP C11 --
# statvfs: the free-space check before a firmware image is written to the
# bootloader drive (firmware.rs). Already in the lock (alsa, errno, ...).
libc = "0.2"
