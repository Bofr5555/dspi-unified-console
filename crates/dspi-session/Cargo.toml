[package]
name = "dspi-session"
description = "Connect, discover, read and write DSPi device state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dspi-proto.workspace = true
dspi-transport.workspace = true
# For rendering an undone change back as the command that would repeat it.
dspi-cmd.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde = { workspace = true }
dirs = "6.0.0"
# -- WP P1 --
# -- WP S1 --
# -- WP S2 --
# -- WP S3 --
# -- WP S4 --
# -- WP S5 --

[features]
default = ["serde", "bundled-autoeq"]
# About 5 MB of the binary. Off for a build where that matters, such as an
# armv7 Pi; a user-supplied database still works without it.
bundled-autoeq = []
serde = ["dspi-proto/serde"]

[dev-dependencies]
proptest = "1"
