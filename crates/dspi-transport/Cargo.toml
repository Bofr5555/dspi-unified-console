[package]
name = "dspi-transport"
description = "USB transport for DSPi devices, with the remote seam left open"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dspi-proto.workspace = true
thiserror.workspace = true
nusb = { version = "0.2", optional = true }
dspi-link = { workspace = true, optional = true }
midir = { version = "0.10", optional = true }
# -- WP T1 --
# -- WP T2 --
# -- WP T3 --
# -- WP T4 --
# -- WP T5 --
# log::warn! when a LinkTransport is dropped with its notifications never taken.
log.workspace = true
# -- WP P1HL -- a hub's DENIED payload (`link::map_response`). Already in the graph.
serde_json = { workspace = true, optional = true }

[features]
# -- WP CG3 --
default = ["usb"]
# The USB backend (`usb` module, `UsbTransport`), over nusb. Off for iOS and for
# wasm32-unknown-unknown (WP WB1), where nusb has no backend and does not compile.
usb = ["dep:nusb"]
# DSPi Link transport (WP T5).
link = ["dep:dspi-link", "dep:serde_json"]
# Desktop MIDI ports through midir: ALSA, WinMM, CoreMIDI (WP T3). Android and
# iOS supply a MidiPipe instead.
midir = ["dep:midir"]

[dev-dependencies]
proptest = "1"
dspi-link = { workspace = true, features = ["fake-hub"] }
# -- WP T1 --
# -- WP T2 --
# -- WP T3 --
# -- WP T4 --
# -- WP T5 --

