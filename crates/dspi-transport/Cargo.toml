[package]
name = "dspi-transport"
description = "USB transport for DSPi devices, with the remote seam left open"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dspi-proto.workspace = true
thiserror.workspace = true
nusb = "0.2"
dspi-link = { path = "../dspi-link", optional = true }
midir = { version = "0.10", optional = true }
# -- WP T1 --
# -- WP T2 --
# -- WP T3 --
# -- WP T4 --
# -- WP T5 --

[features]
# DSPi Link transport (WP T5).
link = ["dep:dspi-link"]
# Desktop MIDI ports through midir: ALSA, WinMM, CoreMIDI (WP T3). Android and
# iOS supply a MidiPipe instead.
midir = ["dep:midir"]

[dev-dependencies]
proptest = "1"
dspi-link = { path = "../dspi-link", features = ["fake-hub"] }
# -- WP T1 --
# -- WP T2 --
# -- WP T3 --
# -- WP T4 --
# -- WP T5 --

