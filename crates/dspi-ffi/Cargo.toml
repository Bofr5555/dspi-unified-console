[package]
name = "dspi-ffi"
description = "The DSPi core for Kotlin and Swift: the UniFFI library the Android and iOS apps link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib: libdspi_ffi.so for Android and for bindgen's library mode.
# staticlib: the iOS framework. lib: this crate's tests.
name = "dspi_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
# The UniFFI bindgen CLI, built from the workspace so its version always
# matches the library's. `--features cli` keeps its dependencies out of the
# mobile libraries.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
# Without its default `usb`: this crate's own `usb` feature turns it on (WP CG3).
dspi-core = { path = "../dspi-core", default-features = false, features = ["uniffi", "link"] }
uniffi.workspace = true
log.workspace = true
# -- WP SW-M3 -- The hub's binding (namespace `dspi_hub`), feature `hub` only.
dspi-hub = { path = "../dspi-hub", default-features = false, features = ["uniffi"], optional = true }

[features]
# -- WP CG3 --
# On for Android and the host; iOS builds with --no-default-features.
default = ["usb"]
usb = ["dspi-core/usb", "dspi-hub?/usb"]  # -- WP SW-M3 -- the hub's USB too
cli = ["uniffi/cli"]
# -- WP SW-M3 -- Hosting a DSPi Link hub (dspi-hub's `uniffi` binding), for the
# Mac app's slices only (apps/apple/build-xcframework.sh): no hub on iOS or in
# Android's Play build (PLAN-CLIENTS section 8). With `usb`, the hub finds USB
# devices too.
hub = ["dep:dspi-hub"]

[target.'cfg(target_os = "android")'.dependencies]
# Logcat, the only log an Android app has. Same version as the Android app.
android_logger = "0.15.1"
