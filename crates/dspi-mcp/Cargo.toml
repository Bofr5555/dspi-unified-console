[package]
name = "dspi-mcp"
description = "The DSPi console's MCP server: protocol (both spec eras), tools, resources and prompts over a CoreSet (sans-IO)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# -- WP MCP1 -- hand-written protocol, no rmcp and no tokio (owner decision
# 2026-11-21, MPLAN 3.1). Sans-IO: the transports (MCP3) feed `Server::handle`.
[dependencies]
# Without `usb`: the embedder's own dspi-core dependency picks the transports.
dspi-core = { path = "../dspi-core", default-features = false }
dspi-proto.workspace = true
serde_json.workspace = true
# -- WP MCP3 -- the transports (feature `http`): all four already in the lock
# through dspi-hub and dspi-link, at the versions they use.
httparse = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
getrandom = { version = "0.4", optional = true }
data-encoding = { version = "2", optional = true }
log = { workspace = true, optional = true }

# -- WP FEAT3 -- reading this computer's audio (feature `host-audio`) on
# Windows: MMDevice, the endpoint volume and the audio sessions. The same
# `windows` 0.56 midir brings into the lock; only features are added.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", optional = true, features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

# -- WP MCP3 --
[features]
# The loopback HTTP listener, the per-client tokens and pairing, and the stdio
# relay (http.rs, auth.rs, relay.rs). Off, the crate stays sans-IO.
http = ["dep:httparse", "dep:sha2", "dep:getrandom", "dep:data-encoding", "dep:log"]
# -- WP MCP2c --
# The tools that go through the device's DSPi Link session: the audio link's
# installation on the hub (tools/alink.rs `system.*`), Installation setup and
# the hub's reads. Off, those tools are not listed.
link = ["dspi-core/link"]
# -- WP FEAT3 --
# `host_audio::system()`: this computer's audio for dspi_get_host_audio
# (pw-dump and ALSA on Linux, MMDevice on Windows, Core Audio on macOS). Off,
# the crate stays sans-IO and the embedder passes its own reader or none.
host-audio = ["dep:windows"]
# -- WP FBUS -- the function test's simulated host audio bus (dspi-core
# `sim-scenario`) answers `host_audio::system()` while one is loaded, and a demo
# unit it names counts as on this computer. Test-only: on in dspi-capi's
# `sim-scenario` alone, which no shipped build turns on.
sim-bus = ["dspi-core/sim-scenario"]

[dev-dependencies]
# A measurement document for the tests (a workspace crate, already a dependency
# of dspi-core).
dspi-measure.workspace = true
# -- WP MCP2c -- the hub and installation tools against a real in-process hub
# with fake alink units (as dspi-hub's tests/wp_inst0_installation.rs). Both
# workspace crates, already in the lock.
# -- WP FEAT2 -- `api`: its group writes and its schedule (no new crate)
dspi-hub = { workspace = true, default-features = false, features = ["api"] }
dspi-transport = { path = "../dspi-transport", default-features = false, features = ["link"] }
# -- WP MCP5 -- the measuring tools against the demo's simulated microphone
# (P5DEMO), as the Qt and Terminal builds have it: the same crate, one more
# feature for the tests.
dspi-core = { path = "../dspi-core", default-features = false, features = ["measure-sim"] }

# -- WP FEAT3 -- `--cfg dspi_check_macos` compiles the Core Audio reader for
# an Apple target the build container has (aarch64-apple-ios): a check only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dspi_check_macos)"] }
