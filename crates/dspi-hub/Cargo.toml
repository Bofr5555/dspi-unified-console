[package]
name = "dspi-hub"
description = "The DSPi Link hub: owns local devices and serves them to the app and to network clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# docs/core-merge/HUB.md is the design. No UI and no OS code here: a binding
# decides when a hub runs. Not in any mobile graph (PLAN-CLIENTS section 8).

[features]
default = ["usb"]
# The hub finds and claims USB devices itself (usb.rs). Without it a hub serves
# only what the embedder attaches.
usb = ["dep:nusb", "dspi-transport/usb"]
# The embedding app as a hub session (app.rs). Off for a headless hub, which has
# no DspiCore. Why not always on: `uconsole hub` would link the whole embedder API
# to use none of it.
app = ["dep:dspi-core"]
# The Bonjour responder (advertise.rs, WP HB5), CG2's `MdnsAdvertiser`.
mdns = ["dspi-link/mdns"]
# -- WP P2PA --
# The parameter API, its action executor and hub-side snapshot recall (api/): a
# `DspiCore` per principal and device inside the hub, so every write goes through
# `write_param` and the typed setters' guards. Off by default, as `app`: the binary
# that serves the API (`uconsole hub`) asks for it.
api = ["dep:dspi-core"]
# -- WP SECSRV --
# Test only, never in a shipped build: `NetworkConfig::new` takes its TLS mode from
# DSPI_HUB_TEST_TLS (off, on, compat, require), so the existing suites run unchanged
# against a hub that sniffs and serves TLS (`ci/run.sh 'DSPI_HUB_TEST_TLS=compat
# cargo test -p dspi-hub --features api,test-tls-mode'`).
test-tls-mode = []
# -- WP P3RO --
# The firmware rollout (rollout.rs, PLAN-P3 F6): the parameter API's executor, the
# core's PICOBOOT writer over its USB. Off by default: `uconsole hub` asks for it.
rollout = ["api", "usb", "dspi-core/usb"]
# -- WP SW-M3 --
# The Swift binding (ffi.rs): the UniFFI namespace `dspi_hub`, which the library
# `crates/dspi-ffi` carries with its feature `hub` (the Mac app's slices only).
uniffi = ["dep:uniffi", "app", "dspi-core/uniffi"]

[dependencies]
dspi-proto.workspace = true
# `link` for its status table (`map_status`), so the app's in-process transport
# and the network one read a hub's answer the same way. No USB unless asked.
dspi-transport = { path = "../dspi-transport", default-features = false, features = ["link"] }
# The frame types and codec the hub shares with the client.
# -- WP SECSRV -- and its `tls` module (feature `tls`): TLS on the Link port, the
# split-safe TlsPipe, the first-byte sniff and the SPKI pin (PLAN-SEC 4.1).
dspi-link = { workspace = true, features = ["tls"] }
# -- WP HB2 --
# `overvolt`, the owner's voltage rule, and the status read it goes by: one rule, the one
# the clients run. Without default features: none of what they add is used here.
dspi-session = { path = "../dspi-session", default-features = false }
dspi-core = { workspace = true, optional = true }
# -- WP SW-M3 --
uniffi = { workspace = true, optional = true }
thiserror.workspace = true
log.workspace = true
# policy/commands.json, the hub's command table (policy.rs).
serde.workspace = true
serde_json.workspace = true
# Bus enumeration with the vendor id, which `dspi_transport::list_devices` does
# not report and `dspi-core` needs to tell legacy firmware. Same version as there.
nusb = { version = "0.2", optional = true }
# -- WP HB1 --
# The server's WebSocket, and socket options std lacks (dual-stack bind): at
# dspi-link's pins, since the two share a `Pipe`.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
socket2 = "=0.6.1"
# The HTTP request head before the upgrade. Already in the graph through tungstenite.
httparse = "1"
# The machine's addresses: what counts as the hub itself for the Origin check, and
# which peers are on its network. Same pin as mdns-sd's, which brings it in anyway.
if-addrs = "=0.15.0"
# Tokens are stored as their SHA-256 (spec 6.2). Same family as tungstenite's sha1.
sha2 = "0.11"
# The OS's CSPRNG for tokens, PINs and the hub id. Already in the graph through rand.
getrandom = "0.4"
# base64url for tokens and hex for their hashes. Already in the graph through dspi-link.
data-encoding = "2"
# -- WP SECKEY --
# The hub's TLS identity (tls_identity.rs, PLAN-SEC 4.2, OD-SECd): the self-signed
# certificate. ring only, the provider the workspace's rustls uses; `pem` for key.pem.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
# Wipes the private key's bytes when an identity is dropped. Already in the graph
# through rustls.
zeroize = "1"
# rcgen's dates. Already in the graph through rcgen, at its version.
time = { version = "0.3.47", default-features = false }
# -- WP P2SC --
# Schedules run in the hub machine's local time (OD-P2h): its time zone from the
# system's zone database (TZ, /etc/localtime; bundled on Windows only), DST gaps
# and repeats resolved by the zone's own transitions.
jiff = "=0.2.39"
# -- WP SECOUT --
# Outbound TLS for webhooks and MQTT (src/outbound/tls.rs, PLAN-SEC 4.8): rustls with
# ring, so nothing links the system's OpenSSL and the Windows build cross-compiles (as
# dspi-tui's); TLS 1.2 as well as 1.3, which receivers and brokers in the wild still
# speak; its `pki_types` reads the pasted PEMs. The default trust is webpki-roots
# (OD-SECf). Both already in the lockfile through dspi-tui's ureq.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
# -- review seca -- SECPIPE's tls module for the SECKEY/SECPIPE cross tests
# (tests/review_seca_tls_cross.rs). -- WP SECSRV -- now a normal dependency too.
# -- WP SECPAKE -- `fake-hub` for its FakeTlsKey: the MITM proxy's own key
# (tests/wp_secpake.rs).
dspi-link = { workspace = true, features = ["tls", "fake-hub"] }
dspi-transport = { path = "../dspi-transport", default-features = false, features = ["link"] }
# -- WP HB2 --
proptest = "1"
# -- WP HB3 --
# tests/wp_hb3_meter_feed.rs: C15's own client, in `DspiCore`, over the real server.
dspi-core = { workspace = true, features = ["link"] }
# -- WP HB5 --
# tests/wp_hb5_advertise.rs: a browser kept to the loopback interface, which
# `MdnsSource` is not, and a raw look at what is on the wire. Same pin as dspi-link's.
mdns-sd = { version = "=0.21.7", default-features = false, features = ["logging"] }
# -- WP SECKEY --
# tls_identity.rs's tests: a real TLS 1.3 handshake against the certificate, and the
# rotation signature checked with ring itself. Both already in the graph (dspi-tui).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"

[[test]]
name = "wp_hb0_app_path"
required-features = ["app"]

[[test]]
name = "wp_hb0_connect_time"
required-features = ["app"]

# -- WP HB2 --
[[test]]
name = "wp_hb2_app_vreg"
required-features = ["app"]

# -- WP HB1 --
[[test]]
name = "wp_hb1_vreg_wire"
required-features = ["app"]

# -- WP HB5 --
[[test]]
name = "wp_hb5_advertise"
required-features = ["mdns"]

# -- WP P2PA --
[[test]]
name = "wp_p2pa_api"
required-features = ["api"]

# -- WP P2RS --
[[test]]
name = "wp_p2rs_rest"
required-features = ["api"]

# -- WP P2SC --
[[test]]
name = "wp_p2sc_schedule"
required-features = ["api"]

# -- WP P2HA --
[[test]]
name = "wp_p2ha_home_assistant"
required-features = ["api"]

# -- WP FLAKE4 -- their hub caps (param_api, alarms, schedule) need the API: a plain
# `cargo test -p dspi-hub` skips them, as wp_p2pa_api.
[[test]]
name = "wp_p2cc1_core_calls"
required-features = ["api"]

# -- WP P3HB --
[[test]]
name = "wp_p3hb_core_calls"
required-features = ["api"]

[[test]]
name = "wp_p2cc2_core_calls"
required-features = ["api"]

# -- WP P2FFIX --
[[test]]
name = "wp_p2ffix_adopted_guard"
required-features = ["api"]

# -- WP P3RO --
[[test]]
name = "wp_p3ro_rollout"
required-features = ["rollout"]

# -- WP P3CC --
[[test]]
name = "wp_p3cc_core_calls"
required-features = ["rollout"]

# -- WP HB7 --
# tests/conformance/: three Link clients against the hub (README.md there).
[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
