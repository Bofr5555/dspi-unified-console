[package]
name = "dspi-proto"
description = "DSPi wire protocol: opcodes, bulk-params codec, DSP math, parameter registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }
# -- WP P1 --

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
proptest = "1"
serde_json.workspace = true
# -- WP P1 --

[build-dependencies]
# The generator parses the vendored firmware headers. Deliberately dependency
# free: it is a small, purpose-built scanner, not a general C parser, so it has
# no build cost and nothing to keep up to date.
# -- WP PGPROTO --
# serde_json reads the vendored paged-protocol registry and legacy map
# (firmware/protocol/*.json, PLAN-PG OD-PGj): JSON, not C, so a scanner would be
# a parser of our own; serde_json is already in the workspace.
serde_json.workspace = true
