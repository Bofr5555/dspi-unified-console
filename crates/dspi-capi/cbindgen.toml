# cbindgen configuration of the C ABI's header, include/dspi_core.h (WP Q1).
# The old desktop core's (the retired crate's cbindgen.toml), plus the
# callback typedefs, so the records and constants are in the header before
# the functions that use them land (WPs Q2a, Q2b).
language = "C"
include_guard = "DSPI_CORE_H"
autogen_warning = "/* Auto-generated by cbindgen. Do not edit. */"

[export]
include = [
    "FilterParams",
    "SystemStatus",
    "DeviceInfo",
    "PlatformInfo",
    "PresetDirectory",
    "DspState",
    "NotifyResult",
    "UpmixStatus",
    "LgStatus",
    "UartConfig",
    "I2cConfig",
    "CtrlIfaceStatus",
    "InputLockStatus",
    "AdatOutStatus",
    "RtaRequest",
    "RtaCapsInfo",
    "RtaSnapshot",
    "SiggenConfig",
    "SiggenStatus",
    "SiggenCaps",
    "BufferStats",
    "SpdifRxStatus",
    "DeviceEventCallback",
    "NotifyCallback",
]
