# cbindgen configuration of the C ABI's header, include/dspi_core.h (WP Q1).
# The old desktop core's (the retired crate's cbindgen.toml), plus the
# callback typedefs, so the records and constants are in the header before
# the functions that use them land (WPs Q2a, Q2b).
language = "C"
include_guard = "DSPI_CORE_H"
autogen_warning = "/* Auto-generated by cbindgen. Do not edit. */"
# -- WP P1TZ -- the behaviour change of OD-P1f, at the top of the header.
header = """/*
 * Confirmation tokens are always required (WP P1TZ, OD-P1f).
 * Every dangerous operation (preset save, copy and delete, parameter save,
 * factory reset, output configuration save, bootloader, configuration
 * import, stored core voltage, firmware install) is refused with code
 * `confirmation_required`, and nothing is sent, unless its `_confirmed`
 * function is given a token from `dspi_confirm_token`. The plain functions
 * (`dspi_save_preset`, `dspi_config_import`, ...) and the gated paths of
 * `dspi_write_param` are always refused so. There is no switch:
 * `dspi_require_confirmation` and `dspi_confirmation_required` are removed.
 */"""

[export]
include = [
    "FilterParams",
    "SystemStatus",
    "DeviceInfo",
    "PlatformInfo",
    "PresetDirectory",
    "DspState",
    "NotifyResult",
    "UpmixStatus",
    "LgStatus",
    "UartConfig",
    "I2cConfig",
    "CtrlIfaceStatus",
    "InputLockStatus",
    "AdatOutStatus",
    "RtaRequest",
    "RtaCapsInfo",
    "RtaSnapshot",
    "SiggenConfig",
    "SiggenStatus",
    "SiggenCaps",
    "BufferStats",
    "SpdifRxStatus",
    "DeviceEventCallback",
    "NotifyCallback",
    # -- WP CG1 --
    "LinkEventCallback",
    # -- WP HB6 --
    "HubEventCallback",
]
