[package]
name = "dspi-capi"
description = "C ABI over dspi-core for the Qt desktop app (header include/dspi_core.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Stays `dspi_capi` (gate 1, S-j): renaming it to `dspi_core` would collide
# in target/ with dspi-core's rlib. The header keeps the name `dspi_core.h`.
# No rlib, for the same collision reason.
name = "dspi_capi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# -- WP P5DEMO -- `measure-sim`: the Qt app's demo mode has the simulated microphone
dspi-core = { workspace = true, features = ["measure-sim"] }
log.workspace = true
serde_json.workspace = true
# -- WP Q1 --
# -- WP Q2a --
# -- WP Q2b --
# The new functions' JSON replies are built from dspi-core's Serialize records.
serde.workspace = true
# -- WP Q3 --
# The old core's logging: dspi_core_new installs it, RUST_LOG picks the level.
# No regex filters, so no regex in the Qt app.
env_logger = { version = "0.11", default-features = false }
# -- WP CG1 --
# dspi_open_midi opens a midir_port; already a dependency of dspi-core, and its
# `midir` feature comes through dspi-core/midir.
dspi-transport.workspace = true
# -- WP HB6 --
# The hub the dspi_hub_* functions start, with the app as its local session.
dspi-hub = { workspace = true, features = ["app"], optional = true }
# -- WP MCP3 --
# The MCP server for AI agents and its loopback transport (the dspi_mcp_* functions).
# -- WP FEAT3 -- `host-audio`: dspi_get_host_audio reads this computer's audio.
dspi-mcp = { path = "../dspi-mcp", features = ["http", "host-audio"], optional = true }

[features]
# -- WP MCP3 -- on by default: the Qt app calls dspi_mcp_* whatever else it is
# built with (its --mcp relay mode, Settings, AI agents), so every build script's
# feature list gets it without naming it.
default = ["mcp"]
link = ["dspi-core/link", "dspi-mcp?/link"]  # -- WP MCP2c -- dspi-mcp's hub tools
midir = ["dspi-core/midir"]
# -- WP CG2 --
# Finding hubs on the network. Off, the dspi_link_browse_* functions refuse.
mdns = ["dspi-core/mdns", "dspi-hub?/mdns"]
# -- WP HB6 --
# Sharing this machine's devices: the dspi_hub_* functions. `app` puts the app's own
# core on the hub, which is what a console does while sharing.
hub = ["dep:dspi-hub"]
# -- WP MCP3 --
mcp = ["dep:dspi-mcp"]

[dev-dependencies]
# -- WP Q1 --
# The constants test checks the header's literals against the generated ones.
dspi-proto.workspace = true
# -- WP Q2a --
# PLAN section 1.9: the C ABI's null and short-buffer property tests.
proptest = "1"
# -- WP Q2b --
# -- WP CG1, CG2 --
# The fake hub, for the Link functions' tests; the fake advertiser, for the browse functions' tests.
dspi-link = { path = "../dspi-link", features = ["fake-hub"] }

[build-dependencies]
# The header (WP Q1), as the old core generated it. 0.29, not the old core's
# 0.27: 0.27 silently drops edition-2024 `#[unsafe(no_mangle)]` functions.
cbindgen = "0.29"
