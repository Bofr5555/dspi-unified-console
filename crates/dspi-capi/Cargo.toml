[package]
name = "dspi-capi"
description = "C ABI over dspi-core for the Qt desktop app (header include/dspi_core.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Stays `dspi_capi` (gate 1, S-j): renaming it to `dspi_core` would collide
# in target/ with the old core's library and with dspi-core's rlib. The
# header keeps the name `dspi_core.h`. The Qt build picks the library with
# the CMake cache variable DSPI_CORE_LIB (ci/check.sh --step qt-capi, from
# wave 3; WP Q3 makes it the default and updates the packaging scripts).
# No rlib, for the same collision reason.
name = "dspi_capi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
dspi-core.workspace = true
log.workspace = true
serde_json.workspace = true
# -- WP Q1 --
# -- WP Q2a --
# -- WP Q2b --
# The new functions' JSON replies are built from dspi-core's Serialize records.
serde.workspace = true

[features]
link = ["dspi-core/link"]
midir = ["dspi-core/midir"]

[dev-dependencies]
# -- WP Q1 --
# Only for wp_q1_snapshot_matches_the_old_crate, which regenerates the old
# core's header in memory to check the committed snapshot; WP Q3 deletes both.
cbindgen = "0.29"
# The constants test checks the header's literals against the generated ones.
dspi-proto.workspace = true
# -- WP Q2a --
# PLAN section 1.9: the C ABI's null and short-buffer property tests.
proptest = "1"
# -- WP Q2b --

[build-dependencies]
# The header (WP Q1), as the old core generated it. 0.29, not the old core's
# 0.27: 0.27 silently drops edition-2024 `#[unsafe(no_mangle)]` functions.
cbindgen = "0.29"
