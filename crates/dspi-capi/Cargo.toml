[package]
name = "dspi-capi"
description = "C ABI over dspi-core for the Qt desktop app (header include/dspi_core.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Stays `dspi_capi` (gate 1, S-j): renaming it to `dspi_core` would collide
# in target/ with dspi-core's rlib. The header keeps the name `dspi_core.h`.
# No rlib, for the same collision reason.
name = "dspi_capi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
dspi-core.workspace = true
log.workspace = true
serde_json.workspace = true
# -- WP Q1 --
# -- WP Q2a --
# -- WP Q2b --
# The new functions' JSON replies are built from dspi-core's Serialize records.
serde.workspace = true
# -- WP Q3 --
# The old core's logging: dspi_core_new installs it, RUST_LOG picks the level.
# No regex filters, so no regex in the Qt app.
env_logger = { version = "0.11", default-features = false }

[features]
link = ["dspi-core/link"]
midir = ["dspi-core/midir"]
# -- WP CG2 --
# Finding hubs on the network. Off, the dspi_link_browse_* functions refuse.
mdns = ["dspi-core/mdns"]

[dev-dependencies]
# -- WP Q1 --
# The constants test checks the header's literals against the generated ones.
dspi-proto.workspace = true
# -- WP Q2a --
# PLAN section 1.9: the C ABI's null and short-buffer property tests.
proptest = "1"
# -- WP Q2b --
# -- WP CG2 --
# The fake advertiser, for the browse functions' tests.
dspi-link = { path = "../dspi-link", features = ["fake-hub"] }

[build-dependencies]
# The header (WP Q1), as the old core generated it. 0.29, not the old core's
# 0.27: 0.27 silently drops edition-2024 `#[unsafe(no_mangle)]` functions.
cbindgen = "0.29"
