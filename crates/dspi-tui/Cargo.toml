[package]
name = "dspi-tui"
description = "The DSPi terminal interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dspi-proto.workspace = true
# `link`: the terminal opens DSPi Link hubs itself (WP R1, shell/connect.rs).
dspi-transport = { workspace = true, features = ["link"] }
dspi-session.workspace = true
dspi-cmd.workspace = true
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
dirs = "6.0.0"
toml = "1.1.4"
serde = { workspace = true, features = ["derive"] }
# -- WP R1 --
# The hub session the terminal connects, pairs and closes (shell/connect.rs);
# dspi-transport only wraps an open one.
dspi-link.workspace = true
# OpenError, as the other crates' typed errors.
thiserror.workspace = true
# -- WP TM12 --
# The AutoEQ rebuild's HTTPS (autoeq_fetch.rs), which was a `curl` process. Blocking,
# which is what the session's fetch is, so no async runtime as reqwest would need.
# rustls with ring, so nothing links the system's OpenSSL and the Windows build
# cross-compiles; no gzip, since the fetch has no use for it; socks-proxy costs
# no crate and keeps what `curl` honoured in ALL_PROXY. Only this crate and
# dspi-term see it: the core, the session and the mobile libraries do not.
ureq = { version = "3.5", default-features = false, features = ["rustls", "socks-proxy"] }

[features]
default = ["midi", "mdns"]
# `--midi`: desktop MIDI ports through midir. Off, the build needs no ALSA
# headers on Linux and `--midi` says it is unavailable.
midi = ["dspi-transport/midir"]
# -- WP TM9 --
# `--hub`, and looking for a lost hub at new addresses, through dspi-link's mDNS.
# Off, a hub is reached by its address only.
mdns = ["dspi-link/mdns"]

[dev-dependencies]
# -- WP R1 --
# The in-process hub the Link tests connect to.
dspi-link = { workspace = true, features = ["fake-hub"] }
# -- WP TM4 --
# Holds the read-only opcode table to the Link policy fixture (shell/read_only.rs).
serde_json.workspace = true
# -- WP TM12 --
# A TLS server on loopback, for the tests of what the fetch trusts. Already in the
# graph through ureq.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
