[package]
name = "dspi-link"
version = "0.1.0"
edition = "2021"
# Written by the owner in dspi-android (whose workspace said UNLICENSED, under
# that repo's GPL-3.0 LICENSE). Its origin is MIT: Weeb Labs' DSPi-Link spec and
# policy (tests/fixtures/link/LICENSE.DSPi-Link). See docs/licensing/.
license.workspace = true
repository.workspace = true
publish = false
description = "DSPi Link client (protocol 1.2, 1.1 hubs): frames, control plane, session over a WebSocket byte pipe"

# Independent of dspi-core and of any FFI: the embedder (dspi-ffi `link.rs`)
# adapts `LinkClient` to the core's `Transport` trait. So the crate can move
# into a shared Weeb Labs Rust core unchanged (CONSOLE-UNIFICATION-STUDY.md
# section 6.1, `dspi-link`).

[features]
# The in-process fake hub used by the tests and the `dspi-link-fakehub` binary.
fake-hub = []
# -- WP CG2 --
# Finding hubs and advertising one over mDNS (discovery.rs). Desktop only: the
# Qt app and the Terminal have no system API to lean on, while Android and iOS
# browse with NsdManager and NWBrowser, so their libraries leave it off.
# -- WP DISC2 -- On Windows it is Windows' own DNS-SD (dnsapi) instead of the
# embedded daemon: each dependency exists only on its platform.
mdns = ["dep:mdns-sd", "dep:windows-sys"]
# -- WP SECPIPE --
# TLS 1.3 on the DSPi Link port (tls.rs; docs/core-merge/PLAN-SEC.md 4.1-4.3):
# the pin verifier, the split-safe TlsPipe, the SPKI hash. Native only: the
# dependencies exist only off the web, and so does the module, so the web build
# never has it even with the feature on. Off by default; the core turns it on
# for native targets (SECCORE).
tls = ["dep:rustls", "dep:rustls-webpki", "dep:ring", "dep:spake2"]
# -- WP PGFIX --
# Test-only knobs (`messages::test_knobs`): the hello minor a client on this
# thread sends, so a test's own `LinkClient` can be a 1.2 (minor 2) client.
# Never in a shipped build.
test-knobs = []

[dependencies]
# Sync WebSocket over std::net::TcpStream (RFC 6455), no TLS: the protocol is
# plaintext (spec 6.4). `handshake` = the HTTP upgrade (http, httparse, sha1,
# data-encoding). See docs/SUPPLY-CHAIN.md for why this crate.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# base64 for `bulk_b64` / `status_b64`; already a tungstenite dependency.
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { workspace = true }
thiserror = { workspace = true }
# -- WP CG2 --
# DNS-SD for `_dspi._tcp` (spec 3.1). Why this crate: no async runtime, pure Rust
# (no Avahi or Bonjour to install on Linux or Windows), browser and responder in
# one (HB5 reuses the latter), and it follows interface changes by itself. Writing
# mDNS by hand is the alternative: a multi-interface RFC 6762 cache is not small.
# Without `async` (we use its blocking receiver) and with `logging` (log crate).
# -- WP DISC2 -- Not on Windows (below), moved to the table after this one.

# -- WP WB2 --
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# SO_KEEPALIVE with its timers: std has no API for it, and this is the one
# portable way (Android, Linux, macOS, Windows) without unsafe in this crate.
# It has no wasm32-unknown-unknown backend, and there are no sockets there.
socket2 = "=0.6.1"
# -- WP SECPIPE -- TLS (feature `tls`), the versions the lock already holds for
# dspi-tui's ureq. rustls with the ring provider: already licensed in deny.toml,
# already cross-compiled for Windows and Android, no system OpenSSL and no
# aws-lc build (C and CMake). `std`; no `tls12` (TLS 1.3 only), no `logging`.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"], optional = true }
# rustls's certificate parser, for the SubjectPublicKeyInfo of the hub's
# certificate (the pin); no crypto of its own is used.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"], optional = true }
# SHA-256 of the SPKI and the ECDSA P-256 check of a key rotation signature:
# the crypto rustls already runs on here, rather than sha2 beside it.
ring = { version = "0.17.14", optional = true }
# -- WP SECPAKE -- SPAKE2 for `auth.pair2` (pake.rs; PLAN-SEC SECPAKE, OD-SECc):
# RustCrypto's, MIT or Apache-2.0, the Ed25519 group. 0.5.0-pre.0 rather than
# 0.4.0: the same protocol code on the RustCrypto generation the lock already
# holds (sha2 0.11, digest 0.11, rand_core 0.10), where 0.4 would pull a second,
# older stack (sha2 0.10, rand_core 0.6, curve25519-dalek 4). New with it:
# curve25519-dalek 5.0.0 (BSD-3-Clause), hkdf 0.13.0 and hmac 0.13.0. No
# `getrandom` feature: pake.rs seeds it from ring's SystemRandom, which can
# fail without a panic. HKDF and HMAC of our own are ring's.
spake2 = { version = "=0.5.0-pre.0", default-features = false, optional = true }

# -- WP CG2, DISC2 -- The embedded mDNS daemon, everywhere but Windows (see above).
[target.'cfg(not(windows))'.dependencies]
mdns-sd = { version = "=0.21.7", default-features = false, features = ["logging"], optional = true }

# -- WP DISC2 --
# Windows' DNS-SD (dnsapi.dll: DnsServiceBrowse/Resolve/Register, Windows 10 1809+),
# the machine's DNS host name, and interface changes (iphlpapi), after which a
# registration is made again. The version the lock already holds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_Dns",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_SystemInformation",
] }

# -- WP WB2 --
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Only for the error type of its custom backend (`clock.rs`, `random`), which
# the web build selects: tungstenite reaches getrandom through rand. The
# version the lock already holds for rand.
getrandom = "=0.4.3"

[[bin]]
name = "dspi-link-fakehub"
path = "src/bin/fakehub.rs"
required-features = ["fake-hub"]

[[test]]
name = "client_fakehub"
required-features = ["fake-hub"]

# -- WP WB4b --
[[test]]
name = "wp_wb4b"
required-features = ["fake-hub"]

[[test]]
name = "wp_l1"
path = "tests/wp_l1/main.rs"
required-features = ["fake-hub"]

# -- WP DISC2 -- measuring discovery on a real network (Windows' DNS-SD in the VM)
[[example]]
name = "lan_probe"
required-features = ["mdns"]
