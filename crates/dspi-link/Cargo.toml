[package]
name = "dspi-link"
version = "0.1.0"
edition = "2021"
# Written by the owner in dspi-android (whose workspace said UNLICENSED, under
# that repo's GPL-3.0 LICENSE). Its origin is MIT: Weeb Labs' DSPi-Link spec and
# policy (tests/fixtures/link/LICENSE.DSPi-Link). See docs/licensing/.
license.workspace = true
repository.workspace = true
publish = false
description = "DSPi Link client (protocol 1.2, 1.1 hubs): frames, control plane, session over a WebSocket byte pipe"

# Independent of dspi-core and of any FFI: the embedder (dspi-ffi `link.rs`)
# adapts `LinkClient` to the core's `Transport` trait. So the crate can move
# into a shared Weeb Labs Rust core unchanged (CONSOLE-UNIFICATION-STUDY.md
# section 6.1, `dspi-link`).

[features]
# The in-process fake hub used by the tests and the `dspi-link-fakehub` binary.
fake-hub = []
# -- WP CG2 --
# Finding hubs and advertising one over mDNS (discovery.rs). Desktop only: the
# Qt app and the Terminal have no system API to lean on, while Android and iOS
# browse with NsdManager and NWBrowser, so their libraries leave it off.
mdns = ["dep:mdns-sd"]

[dependencies]
# Sync WebSocket over std::net::TcpStream (RFC 6455), no TLS: the protocol is
# plaintext (spec 6.4). `handshake` = the HTTP upgrade (http, httparse, sha1,
# data-encoding). See docs/SUPPLY-CHAIN.md for why this crate.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# base64 for `bulk_b64` / `status_b64`; already a tungstenite dependency.
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { workspace = true }
thiserror = { workspace = true }
# -- WP CG2 --
# DNS-SD for `_dspi._tcp` (spec 3.1). Why this crate: no async runtime, pure Rust
# (no Avahi or Bonjour to install on Linux or Windows), browser and responder in
# one (HB5 reuses the latter), and it follows interface changes by itself. Writing
# mDNS by hand is the alternative: a multi-interface RFC 6762 cache is not small.
# Without `async` (we use its blocking receiver) and with `logging` (log crate).
mdns-sd = { version = "=0.21.7", default-features = false, features = ["logging"], optional = true }

# -- WP WB2 --
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# SO_KEEPALIVE with its timers: std has no API for it, and this is the one
# portable way (Android, Linux, macOS, Windows) without unsafe in this crate.
# It has no wasm32-unknown-unknown backend, and there are no sockets there.
socket2 = "=0.6.1"

# -- WP WB2 --
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Only for the error type of its custom backend (`clock.rs`, `random`), which
# the web build selects: tungstenite reaches getrandom through rand. The
# version the lock already holds for rand.
getrandom = "=0.4.3"

[[bin]]
name = "dspi-link-fakehub"
path = "src/bin/fakehub.rs"
required-features = ["fake-hub"]

[[test]]
name = "client_fakehub"
required-features = ["fake-hub"]

# -- WP WB4b --
[[test]]
name = "wp_wb4b"
required-features = ["fake-hub"]

[[test]]
name = "wp_l1"
path = "tests/wp_l1/main.rs"
required-features = ["fake-hub"]
