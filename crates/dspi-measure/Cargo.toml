[package]
name = "dspi-measure"
description = "Measurement maths for the DSPi console: sweeps, impulse responses, calibration, targets, alignment, crossover and EQ fits (pure)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# -- WP PLANP5 -- the seam (docs/core-merge/PLAN-P5.md section 2). Pure: no I/O,
# no threads, no clock, no device, no audio API. Runs unchanged in wasm32.
[dependencies]
dspi-proto.workspace = true
thiserror.workspace = true
serde = { workspace = true }
# -- WP PLANP5 (review RC9, RC10) -- added with the seam so no P5-A WP edits this
# file or Cargo.lock: documents (P5MDOC), the FFT (P5TIME, P5RESP). rustfft is
# scalar only (no run-time SIMD choice), so native and wasm compute alike.
serde_json.workspace = true
base64 = "0.23"
rustfft = { version = "6", default-features = false }

[features]
# -- WP P5SIM -- the simulated acoustic world (speakers, rooms, couplers, a
# drifting microphone clock) for tests, golden files and the demo device.
sim = []

[dev-dependencies]
proptest = "1"
