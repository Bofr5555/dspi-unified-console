[package]
name = "dspi-wasm"
description = "The web binding (WP WB3): dspi-core in wasm behind the web console's Worker, JSON calls, one at a time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A cdylib for the page (wasm32-unknown-unknown, `tools/build.sh`), and an rlib
# so the calls and the guard are tested natively (`ci/check.sh --crate dspi-wasm`).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Two calls only the binding's own test module has: `test.sleep` (a call that
# suspends under JSPI) and `test.panic`. Never in the module the page loads.
test-hooks = []

[dependencies]
dspi-proto = { path = "../dspi-proto" }
# -- WP WB4b -- `link`: DSPi Link sessions over the browser's WebSocket (src/link.rs)
dspi-core = { path = "../dspi-core", default-features = false, features = ["link"] }
dspi-link = { path = "../dspi-link" }
dspi-transport = { path = "../dspi-transport", default-features = false }
serde.workspace = true
serde_json.workspace = true

# -- WP WB4b --
[dev-dependencies]
# The fake hub, for the Link calls' native tests (caller-driven, as on the web).
dspi-link = { path = "../dspi-link", features = ["fake-hub"] }
