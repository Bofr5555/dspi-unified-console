[package]
name = "dspi-core-linux"
version = "0.1.0"
edition = "2021"

# Retired by the core merge (docs/core-merge/PLAN.md, WP Q3): the package is
# renamed so the new embedder crate can be `dspi-core`; the library keeps
# its name, so the Qt build is unchanged until it switches.
[lib]
name = "dspi_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
rusb = "0.9"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde_json = "1"

# Windows and macOS: libusb is built from source into the core (no system
# libusb to install; on Windows it talks to WinUSB). Linux links the
# distribution's libusb.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }

[build-dependencies]
cbindgen = "0.27"
