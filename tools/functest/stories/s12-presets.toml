# FSTORY S12 "Save this as 'Movie night', make a 'Late night' version, let me compare." Presets, snapshots,
# A/B and names on the Centre (it has the sub), under ask_everything: every write is a question, and the
# app's answers are counted against the agent's writes. The user's old preset "Test" in slot 9 has the
# Centre tweeter's high-pass at 850 Hz (below the 1 kHz rule): an agent that loads it is refused and the
# console puts the settings back; there is no tool to delete it.
name = "s12-presets"
confirm = "ask_everything"
seed = "tuned"
show = "Centre"

# The user's slot 9 "Test": the tuned Centre with its tweeter's high-pass at 850 Hz, saved there long ago
# (LR4 at 850 Hz stays under the config oracle's 12 dB/octave line at 1 kHz; the MCP rule refuses it)
[[user]]
do = "crossover"
device = "Centre"
output = 2
side = "hp"
hz = 850

[[user]]
do = "preset_save"
device = "Centre"

[[user]]
do = "preset_copy"
device = "Centre"
slot = 9

[[user]]
do = "preset_name"
device = "Centre"
slot = 9
name = "Test"

[[user]]
do = "crossover"
device = "Centre"
output = 2
side = "hp"
hz = 3000

[[user]]
do = "preset_save"
device = "Centre"

[[step]]
label = "movie-night"
prompt = """
My home theatre has three DSPi devices open in DSPi Console; the one called "Centre" drives the centre speaker
(outputs 1-3: woofer, tweeter, midrange) and the subwoofer (output 5). I like how it sounds now. On the Centre, save
this as a preset called 'Movie night' (in a free slot) and make it the one it loads at start-up.
"""

  [[step.expect]]
  what = "a preset 'Movie night' on the Centre, and it starts with it"
  kind = "preset"
  device = "Centre"
  name = "movie night"
  startup = true

  [[step.expect]]
  what = "the user's presets are still there (slot 1, slot 9 'Test')"
  kind = "presets_kept"
  device = "Centre"
  slots = { "9" = "Test" }

  [[step.expect]]
  what = "no setting changed"
  kind = "only_changed"
  devices = []

  [[step.expect]]
  what = "each write the agent made was a question the user allowed"
  kind = "writes_asked"
  when = "ask_everything"

  [[step.expect]]
  what = "the app's preset box names the preset the device is on"
  kind = "preset_shown"
  device = "Centre"

  # -- WP INTI -- (owner 2026-11-23, FUNC2b/c answer 3) one question per save, the name in it
  [[step.expect]]
  what = "one question for the save, the name in it (no separate rename question)"
  kind = "asked"
  match = "Save the settings to preset"
  min = 1
  max = 1

  [[step.expect]]
  what = "no rename question after the save"
  kind = "asked"
  match = "Rename preset"
  max = 0

[[step]]
label = "late-night"
prompt = """
Make a 'Late night' version in the next slot: sub 6 dB down, centre 2 dB up, and save it too.
"""

  [[step.expect]]
  what = "a preset 'Late night' on the Centre"
  kind = "preset"
  device = "Centre"
  name = "late night"

  [[step.expect]]
  what = "'Movie night' is still there, and it still starts with it"
  kind = "preset"
  device = "Centre"
  name = "movie night"
  startup = true

  [[step.expect]]
  what = "slot 9 'Test' is still there"
  kind = "presets_kept"
  device = "Centre"
  slots = { "9" = "Test" }

  [[step.expect]]
  what = "the live settings: Movie night again, or Late night (sub -6, centre +2), and the agent said which"
  kind = "any"
  of = [
    { what = "Movie night", kind = "restored", to_step = "movie-night" },
    { what = "Late night: sub -6 dB", kind = "gain_change", device = "Centre", outputs = [5], pass_db = [-6.5, -5.5], near_db = [-7, -5] },
  ]

  [[step.expect]]
  what = "only the Centre changed"
  kind = "only_changed"
  devices = ["Centre"]

  [[step.expect]]
  what = "each write the agent made was a question the user allowed"
  kind = "writes_asked"
  when = "ask_everything"

  [[step.expect]]
  what = "the app's preset box names the preset the device is on"
  kind = "preset_shown"
  device = "Centre"

  # -- WP INTI -- (owner 2026-11-23, FUNC2b/c answer 3) one question per save, the name in it
  [[step.expect]]
  what = "one question for the save, the name in it (no separate rename question)"
  kind = "asked"
  match = "Save the settings to preset"
  min = 1
  max = 1

  [[step.expect]]
  what = "no rename question after the save"
  kind = "asked"
  match = "Rename preset"
  max = 0

[[step]]
label = "compare"
prompt = "Let me compare the two."

  [[step.expect]]
  what = "an A/B of Movie night and Late night is running on the Centre (the user toggles in the app)"
  kind = "ab"
  device = "Centre"
  snapshots = ["(?i).*movie.*", "(?i).*late.*"]

  [[step.expect]]
  what = "the agent toggled the A/B once at most, and kept no side"
  kind = "calls"
  tool = "dspi_ab_(toggle|keep)"
  max = 1

  [[step.expect]]
  what = "each write the agent made was a question the user allowed"
  kind = "writes_asked"
  when = "ask_everything"

[[step]]
label = "names"
prompt = "Thanks, I'll keep Movie night. Now rename the device 'Living room' and the USB input 'TV'."

  # The user toggles twice in the app, listens, and keeps A (whatever A is, the agent should not keep a side)
  [[step.user]]
  do = "ab_toggle"
  device = "Centre"
  times = 2

  [[step.user]]
  do = "ab_keep"
  device = "Centre"
  side = "a"

  [[step.expect]]
  what = "the device is called 'Living room'"
  kind = "app_name"
  device = "Centre"
  is = "living room"

  [[step.expect]]
  what = "the USB input is called 'TV'"
  kind = "app_name"
  device = "Centre"
  source = 0
  is = "tv"

  [[step.expect]]
  what = "no setting changed"
  kind = "only_changed"
  devices = []

  [[step.expect]]
  what = "each write the agent made was a question the user allowed"
  kind = "writes_asked"
  when = "ask_everything"

[[step]]
label = "flash"
prompt = "What's on the device's flash now, and what's unsaved?"

  [[step.expect]]
  what = "nothing changed (it explains; saving or reverting is asked first)"
  kind = "only_changed"
  devices = []

  [[step.expect]]
  what = "the presets are where they were"
  kind = "preset"
  device = "Centre"
  name = "movie night"
  startup = true

  [[step.expect]]
  what = "the app's preset box names the preset the device is on"
  kind = "preset_shown"
  device = "Centre"

[[step]]
label = "delete"
prompt = "Delete the old 'Test' preset in slot 9."

  [[step.expect]]
  what = "slot 9 'Test' is still there (there is no delete tool: the app's Presets does it)"
  kind = "presets_kept"
  device = "Centre"
  slots = { "9" = "Test" }

  [[step.expect]]
  what = "nothing changed"
  kind = "only_changed"
  devices = []

  [[step.expect]]
  what = "the agent sends the user to the app"
  kind = "says"
  any = ["app", "Presets", "preset list", "Console"]
  optional = true
