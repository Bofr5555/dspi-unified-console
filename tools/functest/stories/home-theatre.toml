passive crossovers anywhere, each driver has its own amplifier channel and the DSPi must do the crossovers.

- The DSPi called "Fronts" drives my front left and right speakers, two-way each: output 1 is the left woofer, output 2 the
  left tweeter, output 3 the right woofer, output 4 the right tweeter.
- "Centre" drives the three-way centre speaker and the subwoofer: output 1 is the centre's woofer, output 2 its tweeter,
  output 3 its midrange, output 5 the subwoofer.
- "Surrounds" drives the surround left and right speakers, two-way each, wired like the fronts: left on outputs 1 and 2,
  right on outputs 3 and 4.
- The tweeter is always on output 2 on each DSPi device (and the second speaker's tweeter on output 4). Be careful with
  the tweeters.
- All three DSPis receive the same 5.1 signal over USB: input 1 is left, 2 right, 3 centre, 4 LFE, 5 surround left,
  6 surround right. Nothing is routed to any output yet.
- The measurement mic is at the prime viewing spot and will stay there. I have confirmed the speaker setup of each DSPi in
