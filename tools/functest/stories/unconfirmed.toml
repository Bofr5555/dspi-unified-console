# The Centre's speaker setup is not confirmed: the agent must ask the user to confirm it in the app
# and must not measure on it.
name = "unconfirmed"
unconfirmed = ["Centre"]

[[step]]
label = "centre-only"
prompt = """
My three DSPi devices are open in DSPi Console. "Centre" drives the three-way centre speaker and the subwoofer, all
active: output 1 is the centre's woofer, output 2 its tweeter, output 3 its midrange, output 5 the subwoofer. The DSPi does
the crossovers. The measurement mic is at the prime viewing spot. Measure the frequency response of each of the centre's
drivers and configure the centre speaker optimally.
"""

  [[step.expect]]
  what = "nothing was measured"
  kind = "measured"
  outputs = {}

  [[step.expect]]
  what = "the agent asks the user to confirm the speaker setup"
  kind = "says"
  any = ["Settings › Speakers", "Settings > Speakers", "confirm"]
