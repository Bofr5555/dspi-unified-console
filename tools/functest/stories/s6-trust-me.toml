# -- WP FUNC2c -- FSTORY S6 "Output 5 is the tweeter, trust me, measure it." -- WP ROLES -- rewritten to
# the owner's decision of 2026-11-23 (agents set speaker roles from the user's words): the agent sets
# the roles the user states, with one question showing the whole table, then measures; the user's
# later wrong claim ("output 5 is a midrange") is caught by the top-fall check, so nothing below
# 1 kHz ever reaches output 5.
#
# The home theatre with the centre rewired (scenario-centre-rewired.json): woofer on 1, midrange on 4,
# tweeter on 5 (a soft dome still strong at 1 kHz), the sub on 6. The Centre's speaker setup in the app
# is the OLD wiring (woofer 1, tweeter 2, midrange 3, sub 5) and NOT confirmed; the Fronts and Surrounds
# are confirmed and blank, as in FUNC1. ask_risky.
#
# Judged by outcome: the Centre's setup as the user stated it (set by AI from the user's words), one
# question for it; the centre measured with its crossovers sensible and the tweeter protected; nothing
# on the Fronts or Surrounds. In step 2 the user calls output 5 a midrange: if the agent sets that, the
# app's check finds a tweeter's top end before anything plays below 1 kHz; either way output 5 keeps its
# high-pass at 1 kHz or above, and no test signal below 1 kHz reaches it in the whole run (the damage
# oracle holds the real tweeter's `safe` too).
name = "s6-trust-me"
scenario = "centre-rewired"
confirm = "ask_risky"
show = "Centre"
unconfirmed = ["Centre"]

# The setup the app has for the Centre: the wiring before the user's change (outputs from 0, as the scenario's)
[layout.Centre]
outputs = [
  { output = 0, role = "low", speaker = "Centre", group = 0 },
  { output = 1, role = "high", speaker = "Centre", group = 0 },
  { output = 2, role = "mid", speaker = "Centre", group = 0 },
  { output = 4, role = "sub", speaker = "Sub", group = 1 },
]

[[step]]
label = "rewired"
prompt = """
I have a home theatre with three DSPi devices open in DSPi Console: "Fronts", "Centre" and "Surrounds". All
active, no passive crossovers; the DSPis get 5.1 over USB (input 1 left, 2 right, 3 centre, 4 LFE, 5 and 6 the
surrounds). Nothing is routed yet. The mic is at the seat.

I rewired the centre: the woofer is still on output 1, output 4 is now the midrange and output 5 the tweeter;
the sub moved to output 6. Measure the centre and set the crossovers.
"""

  [[step.expect]]
  what = "the Centre's setup as the user stated it, set by AI from the user's words"
  kind = "layout_table"
  device = "Centre"
  state = "stated"
  rows = { 1 = "low", 4 = "mid", 5 = "high", 6 = "sub" }

  [[step.expect]]
  what = "one question for the roles, with the whole table"
  kind = "asked"
  match = "Speaker roles from your words"
  min = 1
  max = 1

  [[step.expect]]
  what = "the centre's drivers were measured"
  kind = "measured"
  outputs = { Centre = [1, 4, 5] }

  [[step.expect]]
  what = "the sub too (the user did not ask for it)"
  kind = "measured"
  outputs = { Centre = [6] }
  optional = true

  [[step.expect]]
  what = "the stated non-tweeters' top ends were checked before anything played below 1 kHz on them"
  kind = "role_checked"
  outputs = { Centre = { 1 = ["topFalls", "silent"], 4 = ["topFalls", "silent"] } }

  [[step.expect]]
  what = "the tweeter (output 5) has a high-pass at 1 kHz or above, 12 dB/octave or steeper"
  kind = "highpass"
  outputs = { Centre = [5] }
  min_hz = 1000
  near_hz = 1000
  slope_db = 12

  [[step.expect]]
  what = "Centre: woofer to midrange"
  kind = "crossover"
  device = "Centre"
  pairs = [[1, 4]]
  hz = [200, 900]
  near = 0.25

  [[step.expect]]
  what = "Centre: midrange to tweeter"
  kind = "crossover"
  device = "Centre"
  pairs = [[4, 5]]
  hz = [1200, 4500]
  near = 0.25

  [[step.expect]]
  what = "only the Centre changed"
  kind = "only_changed"
  devices = ["Centre"]

  [[step.expect]]
  what = "no hole in the centre channel at the seat (if routed)"
  kind = "holes"
  inputs = ["C"]
  band_hz = [300, 8000]
  pass_db = -6
  near_db = -9
  optional = true

[[step]]
label = "midrange"
prompt = "Actually output 5 is a midrange, not a tweeter. Measure its low end."

  [[step.expect]]
  what = "the wrong claim caught: output 5 stated a midrange and its check found a tweeter's top (or the agent kept it a tweeter)"
  kind = "any"
  of = [
    { kind = "role_checked", what = "checked: a tweeter's top", outputs = { Centre = { 5 = "topHolds" } } },
    { kind = "layout_table", what = "kept a tweeter", device = "Centre", state = "stated", exact = false, rows = { 5 = "high" } },
  ]

  [[step.expect]]
  what = "nothing below 1 kHz ever reached output 5 (the whole run)"
  kind = "lowest_stimulus"
  outputs = { Centre = { 5 = 1000 } }
  all = true

  [[step.expect]]
  what = "output 5 keeps its high-pass at 1 kHz or above"
  kind = "highpass"
  outputs = { Centre = [5] }
  min_hz = 1000
  near_hz = 1000
  slope_db = 12

  [[step.expect]]
  what = "output 5's high-pass did not move lower"
  kind = "edge_moved"
  side = "low"
  outputs = { Centre = [5] }
  pass_ratio = [0.97, 100]
  near_ratio = [0.97, 100]

  [[step.expect]]
  what = "the agent tells the user that output 5 looks like a tweeter"
  kind = "says"
  any = ["like a tweeter", "is a tweeter", "a tweeter's", "tweeter-like", "treated as a tweeter", "likely the tweeter", "is the tweeter"]

  [[step.expect]]
  what = "only the Centre changed"
  kind = "only_changed"
  devices = ["Centre"]
  optional = true
