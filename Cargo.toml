# One workspace for every Rust part of the unified console:
#   crates/dspi-core        the embedder API over the session (docs/core-merge/PLAN.md)
#   crates/dspi-capi        its C ABI for the Qt app
#   crates/dspi-ffi         its UniFFI library for Android and iOS
#   crates/dspi-proto, -transport, -session, -cmd, -tui  DSPi-Terminal's crates
#   crates/dspi-link        the DSPi Link client, from the Android console
#   crates/dspi-hub         the DSPi Link hub (docs/core-merge/HUB.md)
#   apps/terminal           the `uconsole` terminal client
#   xtask                   DSPi-Terminal's developer tasks
# Every crate takes its licence and repository from [workspace.package] below;
# dspi-link keeps its own version and edition. docs/licensing/ holds the facts
# behind the licence field, which is the owner's working assumption.
[workspace]
resolver = "3"
members = [
    "crates/dspi-core",
    "crates/dspi-capi",
    "crates/dspi-ffi",
    "crates/dspi-proto",
    "crates/dspi-transport",
    "crates/dspi-session",
    "crates/dspi-cmd",
    "crates/dspi-tui",
    "crates/dspi-link",
    # -- WP HB0 --
    "crates/dspi-hub",
    # -- WP PLANP5 -- the measurement maths (docs/core-merge/PLAN-P5.md)
    "crates/dspi-measure",
    # -- WP WB2 -- the wasm gate's scenario module (ci/check.sh --step wasm-core)
    "ci/wasm-scenario",
    # -- WP WB3 -- the web binding (apps/web's Worker loads it)
    "crates/dspi-wasm",
    # -- WP LK3 -- the ESP32 bridge emulator rig's UART tunnel (tools/esp-rig)
    "tools/esp-rig/tunnel",
    # -- WP MCP1 -- the MCP server (sans-IO; transports in MCP3)
    "crates/dspi-mcp",
    "apps/terminal",
    "xtask",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/Bofr5555/dspi-unified-console"

[workspace.dependencies]
dspi-proto = { path = "crates/dspi-proto" }
dspi-transport = { path = "crates/dspi-transport" }
dspi-session = { path = "crates/dspi-session" }
dspi-cmd = { path = "crates/dspi-cmd" }
dspi-tui = { path = "crates/dspi-tui" }
dspi-core = { path = "crates/dspi-core" }
dspi-link = { path = "crates/dspi-link" }
# -- WP HB0 --
dspi-hub = { path = "crates/dspi-hub" }
# -- WP PLANP5 --
dspi-measure = { path = "crates/dspi-measure" }

anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned: UniFFI's Kotlin and Swift output changes between minors. Same pin as
# the Android app (dspi-android/rust/Cargo.toml).
uniffi = "=0.29.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# -- WP CIPAR -- The property tests' build (ci/check.sh --step proptest): the
# release profile's code (opt-level 3, no debug assertions) without its link-
# time work, which made that build take most of the step. Not for shipping.
[profile.proptest]
inherits = "release"
lto = false
codegen-units = 16
