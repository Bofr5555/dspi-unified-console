# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-deny, through `ci/check.sh --step deny`. A list of what the workspace's
# crates declare today, so a new licence or source stops the gate and gets read.
# Not a licensing decision: see docs/licensing/ and PLAN-CLIENTS.md 0.4. The iOS
# subset has its own stricter check (ci/licence-inventory.py).

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The workspace's own crates: the field is the owner's working assumption. Name
# each one, so a third-party GPL crate cannot come in unseen.
exceptions = [
    { crate = "dspi-capi", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-cmd", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-core", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-ffi", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-hub", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-link", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-proto", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-session", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-term", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-transport", allow = ["GPL-3.0-or-later"] },
    { crate = "dspi-tui", allow = ["GPL-3.0-or-later"] },
    { crate = "xtask", allow = ["GPL-3.0-or-later"] },
    # -- WP WB2 -- the wasm gate's scenario module (ci/wasm-scenario)
    { crate = "dspi-wasm-scenario", allow = ["GPL-3.0-or-later"] },
    # -- WP PLANP5 -- the measurement maths (crates/dspi-measure, PLAN-P5)
    { crate = "dspi-measure", allow = ["GPL-3.0-or-later"] },
    # -- WP WB3 -- the web binding (crates/dspi-wasm)
    { crate = "dspi-wasm", allow = ["GPL-3.0-or-later"] },
    # -- WP LK3 -- the ESP32 bridge rig's UART tunnel (tools/esp-rig/tunnel; review c73 F2)
    { crate = "dspi-esp-rig", allow = ["GPL-3.0-or-later"] },
    # -- WP MCP1 -- the MCP server (crates/dspi-mcp)
    { crate = "dspi-mcp", allow = ["GPL-3.0-or-later"] },
    # -- WP TM12 --
    # The Terminal's HTTPS (dspi-tui/src/autoeq_fetch.rs): named one by one, like
    # the rest of this list. Not in the iOS or Android libraries. webpki-roots is
    # Mozilla's root list, as data.
    { crate = "ring", allow = ["Apache-2.0", "ISC"] },
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "subtle", allow = ["BSD-3-Clause"] },
    { crate = "untrusted", allow = ["ISC"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # -- WP SECPAKE -- SPAKE2 pairing (dspi-link pake.rs): the Ed25519 group under
    # RustCrypto's spake2, in every native core library.
    { crate = "curve25519-dalek", allow = ["BSD-3-Clause"] },
]

[bans]
# Licences and sources are this file's job. Duplicates are not.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# -- WP SECDENY -- RustSec advisories (PLAN-SEC SECDENY). `ci/check.sh --step deny`
# fetches the database inside the container into CARGO_HOME (the shared
# ~/.cache/dspi-build/cargo-home), then checks offline against it, so a run with
# no network uses the last database fetched. Every ignore names its reason.
[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities and unsound advisories are always errors (cargo-deny 0.20 has
# no knob for them). Unmaintained crates count anywhere in the graph.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Each finding of the first run (2026-11-15), with why it does not reach us. None
# is a vulnerability. Drop an entry when the lockfile moves past it.
ignore = [
    # rustix 1.1.4 (nusb, tempfile): getxattr/listxattr with a zero-length buffer.
    # Neither nusb 0.2.5 nor tempfile 3.27.0 calls an xattr function, nor does any
    # workspace crate. Fixed in 1.1.6: a `cargo update -p rustix` follow-up.
    { id = "RUSTSEC-2026-0486", reason = "rustix xattr functions: never called (nusb, tempfile, workspace); bump to >=1.1.6 pending" },
    # lru 0.12.5 (ratatui 0.29, Terminal only): ratatui's layout cache keys are
    # (Rect, Layout), plain data with no panicking Drop, and it never calls
    # IterMut or pop(). The fix needs lru >=0.16.3/0.18.2, i.e. a newer ratatui.
    { id = "RUSTSEC-2026-0002", reason = "lru IterMut: not used by ratatui 0.29's layout cache; needs a ratatui upgrade" },
    { id = "RUSTSEC-2026-0253", reason = "lru pop() panic safety: ratatui's keys have no panicking Drop; needs a ratatui upgrade" },
    # Unmaintained, no known defect, no maintained release to move to from here:
    # paste through ratatui 0.29 (a compile-time macro), basic-toml through
    # askama/uniffi_bindgen (build-time binding generator, not in the apps).
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained: macro crate under ratatui 0.29, no defect; goes with a ratatui upgrade" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained: under uniffi_bindgen (askama), no defect; goes with a uniffi upgrade" },
]
