# Every image the build uses, in build order. The one place tags are written:
# ci/run.sh, ci/check.sh and build-images.sh read this file. Change a Containerfile,
# bump its tag here and the tag of each image built on it.
#
# name       tag                                         Containerfile, from the repository root
QTPORT=localhost/dspi-qtport:5                           # ci/container/Containerfile.qtport
COREMERGE=localhost/dspi-coremerge:4                     # ci/container/Containerfile
DENY=localhost/dspi-coremerge-deny:2                     # ci/container/Containerfile.deny
ANDROID=localhost/dspi-android-build:2026-11-01-play     # apps/android/container/Containerfile; tag from apps/android/tools/dev.sh
CROSS=localhost/dspi-cross:1                             # ci/container/Containerfile.cross
# -- WP HB8 -- Pulled, not built (build-images.sh skips it): Node from the official
# image, pinned by digest, for crates/dspi-hub/tests/conformance/run-clients.sh ts.
NODE=docker.io/library/node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
# -- WP WB5 -- Pulled, not built: the official Playwright image (Node, Chromium, Firefox),
# pinned by digest, for apps/web/tools/ci.sh (the `web` step).
PLAYWRIGHT=mcr.microsoft.com/playwright:v1.65.0-noble@sha256:bc4fbb329a25287ed23e9216c97063646abdd1bf2da669a9895fa3e2078b2302
