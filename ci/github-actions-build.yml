# DRAFT: not enabled. GitHub only runs workflows in .github/workflows/; to
# enable, copy this file there and review the pins. (DSPi-Terminal's own
# upstream workflows are kept, also inactive, in apps/terminal/.github/.)
#
# The matrix: Rust tests on Linux, Windows and macOS; the desktop app on
# Linux (Qt 6), on Windows as a MinGW cross build from Linux (the same
# container as a local release) and natively with MSVC on windows-2022,
# and on macOS as a universal app bundle.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licences:
    name: Licences (cargo-deny, deny.toml)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --release -p dspi-term --locked
      - uses: actions/upload-artifact@v4
        with:
          name: dspi-terminal-${{ runner.os }}
          path: |
            target/release/uconsole
            target/release/uconsole.exe

  desktop-linux:
    name: Desktop app, Linux (Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ninja-build libasound2-dev \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qt-labs-settings \
            qml6-module-qt-labs-platform qml6-module-qtqml-workerscript libqt6svg6
      - run: cargo build --release -p dspi-capi --features link,midir,mdns,hub --locked
      - run: cmake -S apps/desktop/qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDSPI_QT_MAJOR=6
      - run: cmake --build build
      # Starts, loads every QML file of the main window, and keeps running
      - run: |
          set +e
          QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 timeout 10 build/DSPiConsole 2> log.txt
          test $? = 124 && ! grep -E 'qrc:.*(Error|is not a type|Cannot assign)' log.txt

  desktop-windows-mingw:
    name: Desktop app, Windows (MinGW cross build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: podman build -t dspi-windows apps/desktop/packaging/windows
      - run: podman run --rm -v "$PWD":/src:Z -w /src dspi-windows apps/desktop/packaging/windows/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dspi-console-windows-mingw
          path: |
            dist/*.zip
            dist/*-setup.exe

  desktop-windows-msvc:
    name: Desktop app, Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      # Qt's official MSVC build, from download.qt.io (aqtinstall under the hood)
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - run: cargo build --release -p dspi-capi --features link,midir,mdns,hub --locked
      - run: cmake -S apps/desktop/qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDSPI_QT_MAJOR=6
      - run: cmake --build build
      - name: Deploy
        shell: bash
        run: |
          mkdir -p dist/DSPiConsole
          cp build/DSPiConsole.exe build/dspi_capi.dll dist/DSPiConsole/
          windeployqt --release --qmldir apps/desktop/qt/qml dist/DSPiConsole/DSPiConsole.exe
      # Signing would go here (signtool, with a certificate from the repository's secrets)
      - uses: actions/upload-artifact@v4
        with:
          name: dspi-console-windows-msvc
          path: dist/DSPiConsole

  desktop-macos:
    name: Desktop app, macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          arch: clang_64
      - run: brew install ninja || true
      # Ad hoc signed; set SIGN_ID (and import a Developer ID certificate)
      # for a distributable build, then notarise with notarytool
      - run: QTDIR="$QT_ROOT_DIR" apps/desktop/packaging/macos/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dspi-console-macos
          path: dist/*.dmg
