[package]
name = "dspi-term"
description = "Terminal control for DSPi audio processors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The command users type. Short matters for one-shot CLI use.
[[bin]]
name = "dspi"
path = "src/main.rs"

[dependencies]
dspi-proto.workspace = true
dspi-transport.workspace = true
dspi-session.workspace = true
dspi-cmd.workspace = true
dspi-tui = { workspace = true, default-features = false }
serde_json.workspace = true
# -- WP R1 --
# `dspi doctor --link` reads the hub's info endpoint.
dspi-link.workspace = true

# -- WP TM10 --
# Documents must cross to the code Qt runs: the tests export and import through it.
[dev-dependencies]
dspi-core = { workspace = true }
# -- WP TM9 --
# `dspi link scan` and `--hub` are tested on a fake network, with no multicast.
dspi-link = { workspace = true, features = ["fake-hub"] }

[features]
default = ["midi", "mdns"]
# `--midi`, through midir (ALSA headers on Linux).
midi = ["dspi-tui/midi"]
# -- WP TM9 --
# `dspi link scan`, `--hub`, and finding a hub that moved while reconnecting.
mdns = ["dspi-tui/mdns"]
