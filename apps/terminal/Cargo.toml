[package]
name = "dspi-term"
description = "Terminal control for DSPi audio processors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The command users type. Short matters for one-shot CLI use.
[[bin]]
name = "dspi"
path = "src/main.rs"

[dependencies]
dspi-proto.workspace = true
dspi-transport.workspace = true
dspi-session.workspace = true
dspi-cmd.workspace = true
dspi-tui = { workspace = true, default-features = false }
serde_json.workspace = true
# -- WP R1 --
# `dspi doctor --link` reads the hub's info endpoint.
dspi-link.workspace = true

[features]
default = ["midi"]
# `--midi`, through midir (ALSA headers on Linux).
midi = ["dspi-tui/midi"]
