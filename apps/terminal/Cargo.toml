[package]
name = "dspi-term"
description = "Terminal control for DSPi audio processors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The command users type. Short matters for one-shot CLI use. The same name is
# `dspi_proto::command!()` (crates/dspi-proto/src/lib.rs), which everything else reads;
# a test in src/main.rs holds the two equal (WP CLEAN1).
[[bin]]
name = "uconsole"
path = "src/main.rs"

[dependencies]
dspi-proto.workspace = true
dspi-transport.workspace = true
dspi-session.workspace = true
dspi-cmd.workspace = true
dspi-tui = { workspace = true, default-features = false }
serde_json.workspace = true
# -- WP R1 --
# `uconsole doctor --link` reads the hub's info endpoint.
dspi-link.workspace = true
# -- WP TM3 --
# `uconsole flash`: the UF2 check, the drive and the firmware guard. Nothing else in
# the terminal uses it.
dspi-core = { workspace = true, features = ["link", "measure-sim"] }  # -- WP TMCORE -- a hub's device as a core DSPi Link session; -- WP P5DEMO -- the demo's simulated microphone
# -- WP TM11 --
# `uconsole hub`: the hub itself, without `app` (no DspiCore in a headless hub).
dspi-hub = { workspace = true, features = ["api", "rollout"] }  # -- WP P2TM -- the parameter API, schedules; -- WP P3TM -- the firmware rollout
# -- WP P3TM -- `firmware add` at the prompt uploads in base64 chunks. Already in the graph
# through dspi-hub and dspi-link.
data-encoding = "2"
# The hub's logs on standard error, with tungstenite held at debug (HB6's rule).
# Same as dspi-capi's.
env_logger = { version = "0.11", default-features = false }
log.workspace = true
# Ctrl-C and SIGTERM stop the hub cleanly, so clients are told and USB is let go.
# Already in the graph through crossterm.
signal-hook = "0.3"
# The hub's default store, in the user's local data directory. As dspi-tui's.
dirs = "6"
# -- WP P1EFIX -- the installer PIN is read without echo (raw mode). Already in
# the graph through dspi-tui (same version): no new crate.
crossterm = "0.28"
# -- WP SECPAIR -- the pairing link as a QR code (PLAN-SEC 4.3). Nayuki's reference
# encoder: MIT, no dependencies, no unsafe.
qrcodegen = "1.8"

# -- WP TM11 -- `uconsole hub` keeps the machine awake on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
# -- WP TM11 -- A background `uconsole hub &` must not stop on SIGTTIN (review c4b).
# Already in the graph.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# -- WP TM10 --
# Documents must cross to the code Qt runs: the tests export and import through it.
[dev-dependencies]
# -- WP TM9 --
# `uconsole link scan` and `--hub` are tested on a fake network, with no multicast.
dspi-link = { workspace = true, features = ["fake-hub"] }

[features]
default = ["midi", "mdns"]
# `--midi`, through midir (ALSA headers on Linux).
midi = ["dspi-tui/midi"]
# -- WP TM9 --
# `uconsole link scan`, `--hub`, and finding a hub that moved while reconnecting.
mdns = ["dspi-tui/mdns", "dspi-hub/mdns"]  # -- WP TM11 -- `uconsole hub` advertises itself
