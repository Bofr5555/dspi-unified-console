# Written by `uconsole usb-direct generate` (WP AUSB3): installation "cinema".
# Copy to ~/.config/pipewire/pipewire.conf.d/ (with the WirePlumber file next to it)
# and restart PipeWire. Guide: docs/integrator/usb-direct-home-theater.md
#
# One sink, "Cinema 7.1", with the programme's channels. combine-stream splits it
# into one stream per DSPi unit; each stream's channels go to the unit's USB
# inputs AUX0.. as its settings sheet (SETTINGS.md) lists them.
#
# The whole graph runs at 48000 Hz with a fixed quantum of 256 samples (5.33 ms),
# so nothing between this sink and the units is resampled. A player at
# another rate is resampled once, into this sink.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 256
}

context.modules = [
    {   name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "dspi-usb-direct.cinema"
            node.description = "Cinema 7.1"
            # The units are aligned by their own D and by the hub, not by PipeWire.
            combine.latency-compensate = false
            combine.props = {
                audio.position = [ FL FR FC LFE RL RR SL SR ]
                audio.rate = 48000
                node.force-quantum = 256
                node.lock-quantum = true
                node.lock-rate = true
            }
            stream.props = {
                resample.disable = true
                node.lock-quantum = true
                node.lock-rate = true
            }
            stream.rules = [
                # front (Front L/C/R and sub): serial E6614C311B4A8B2F
                {   matches = [ { media.class = "Audio/Sink" node.name = "~alsa_output.usb-.*_E6614C311B4A8B2F-00.*" } ]
                    actions = { create-stream = {
                        node.name = "dspi-usb-direct.cinema.front"
                        combine.audio.position = [ FL FR FC LFE ]
                        audio.position = [ AUX0 AUX1 AUX2 AUX3 ]
                    } }
                }
                # sides (Sides): serial E6614C311B4A9C10
                {   matches = [ { media.class = "Audio/Sink" node.name = "~alsa_output.usb-.*_E6614C311B4A9C10-00.*" } ]
                    actions = { create-stream = {
                        node.name = "dspi-usb-direct.cinema.sides"
                        combine.audio.position = [ SL SR ]
                        audio.position = [ AUX0 AUX1 ]
                    } }
                }
                # rears (Rears): serial E6614C311B4AA0D7
                {   matches = [ { media.class = "Audio/Sink" node.name = "~alsa_output.usb-.*_E6614C311B4AA0D7-00.*" } ]
                    actions = { create-stream = {
                        node.name = "dspi-usb-direct.cinema.rears"
                        combine.audio.position = [ RL RR ]
                        audio.position = [ AUX0 AUX1 ]
                    } }
                }
            ]
        }
    }
]
