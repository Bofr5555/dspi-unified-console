# Written by `uconsole usb-direct generate` (WP AUSB3): installation "cinema".
# Copy to ~/.config/wireplumber/wireplumber.conf.d/ (WirePlumber 0.5) and restart
# WirePlumber. Guide: docs/integrator/usb-direct-home-theater.md
#
# Each unit: the pro-audio profile, its sink opened in exactly the USB format
# below, one clock name and one group for all units (they all run on the
# computer's USB frame clock, so no rate matching and no resampling), and
# never suspended: a stream that closes and opens again moves its start
# offset, which the hub then has to align again.
monitor.alsa.rules = [
    # front (Front L/C/R and sub): serial E6614C311B4A8B2F, 4 channels, 24 bit, 48000 Hz
    {   matches = [ { device.name = "~alsa_card.usb-.*_E6614C311B4A8B2F-00" } ]
        actions = { update-props = {
            device.profile = "pro-audio"
        } }
    }
    {   matches = [ { node.name = "~alsa_output.usb-.*_E6614C311B4A8B2F-00.*" } ]
        actions = { update-props = {
            node.description = "Front L/C/R and sub (DSPi USB-direct)"
            audio.format = "S24LE"
            audio.rate = 48000
            audio.channels = 4
            audio.position = [ AUX0 AUX1 AUX2 AUX3 ]
            resample.disable = true
            clock.name = "dspi-usb-direct.cinema"
            node.group = "dspi-usb-direct.cinema"
            priority.driver = 2100
            session.suspend-timeout-seconds = 0
            node.pause-on-idle = false
        } }
    }
    # sides (Sides): serial E6614C311B4A9C10, 2 channels, 24 bit, 48000 Hz
    {   matches = [ { device.name = "~alsa_card.usb-.*_E6614C311B4A9C10-00" } ]
        actions = { update-props = {
            device.profile = "pro-audio"
        } }
    }
    {   matches = [ { node.name = "~alsa_output.usb-.*_E6614C311B4A9C10-00.*" } ]
        actions = { update-props = {
            node.description = "Sides (DSPi USB-direct)"
            audio.format = "S24LE"
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ AUX0 AUX1 ]
            resample.disable = true
            clock.name = "dspi-usb-direct.cinema"
            node.group = "dspi-usb-direct.cinema"
            priority.driver = 2000
            session.suspend-timeout-seconds = 0
            node.pause-on-idle = false
        } }
    }
    # rears (Rears): serial E6614C311B4AA0D7, 2 channels, 24 bit, 48000 Hz
    {   matches = [ { device.name = "~alsa_card.usb-.*_E6614C311B4AA0D7-00" } ]
        actions = { update-props = {
            device.profile = "pro-audio"
        } }
    }
    {   matches = [ { node.name = "~alsa_output.usb-.*_E6614C311B4AA0D7-00.*" } ]
        actions = { update-props = {
            node.description = "Rears (DSPi USB-direct)"
            audio.format = "S24LE"
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ AUX0 AUX1 ]
            resample.disable = true
            clock.name = "dspi-usb-direct.cinema"
            node.group = "dspi-usb-direct.cinema"
            priority.driver = 2000
            session.suspend-timeout-seconds = 0
            node.pause-on-idle = false
        } }
    }
]
