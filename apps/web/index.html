<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A hub that serves this page sets content to its Link address (ws://host:port). -->
    <meta name="dspi-hub" content="" />
    <!-- WP WB7: and to its own page (/), which the console links to. -->
    <meta name="dspi-hub-page" content="" />
    <title>uConsole for DSPi</title>
    <!-- ICON1: the project's icon, from assets/icon/render.sh -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- WP UB2: Add to Home Screen gives an app (the remote), in the page's own greys -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="dspi-web.css" />
    <!-- WP WB7: no inline style, so a host's policy can be style-src 'self'. -->
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <div id="console"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
